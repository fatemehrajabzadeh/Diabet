<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🩸 آزمایشگاه سه‌بعدی دیابت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:
      radial-gradient(circle at 12% 18%, #3a0018 0%, transparent 45%),
      radial-gradient(circle at 88% 12%, #001a3a 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, #1a0030 0%, transparent 50%),
      linear-gradient(160deg,#08000a 0%,#12001a 35%,#1a0028 65%,#0a0010 100%);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1rem;
    overflow-x:hidden;
    position:relative;
  }

  /* ستاره‌ها */
  body::before{
    content:"";position:fixed;inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 25%,#fff,transparent),
      radial-gradient(1px 1px at 65% 55%,#ffd0e0,transparent),
      radial-gradient(1.5px 1.5px at 35% 85%,#fff,transparent),
      radial-gradient(1px 1px at 80% 20%,#b8e0ff,transparent),
      radial-gradient(1.5px 1.5px at 50% 10%,#fff,transparent);
    opacity:.6;
    animation:twinkle 6s ease-in-out infinite alternate;
    pointer-events:none;z-index:0;
  }
  @keyframes twinkle{from{opacity:.3}to{opacity:.8}}

  /* هاله‌های نئونی */
  .orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
  .orb.a{width:420px;height:420px;background:#ff1e4d60;top:-100px;right:-100px;animation:floatOrb 14s ease-in-out infinite}
  .orb.b{width:380px;height:380px;background:#00f0ff40;bottom:-120px;left:-100px;animation:floatOrb 16s ease-in-out infinite reverse}
  .orb.c{width:300px;height:300px;background:#ff2e8840;top:40%;left:50%;transform:translate(-50%,-50%);animation:pulseOrb 10s ease-in-out infinite}
  @keyframes floatOrb{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,35px)}}
  @keyframes pulseOrb{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.4}50%{transform:translate(-50%,-50%) scale(1.25);opacity:.7}}

  /* ذرات گلوکز */
  .gp{
    position:fixed;width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#ff5c7a 60%,#ff1e4d);
    box-shadow:0 0 12px #ff1e4d,0 0 24px #ff1e4d80;
    pointer-events:none;z-index:2;opacity:.7;
    animation:particleFloat 9s ease-in-out infinite;
  }
  .gp:nth-child(1){top:12%;left:8%;animation-delay:0s}
  .gp:nth-child(2){top:75%;left:12%;animation-delay:-2s;width:10px;height:10px}
  .gp:nth-child(3){top:20%;right:10%;animation-delay:-4s;width:6px;height:6px}
  .gp:nth-child(4){top:82%;right:15%;animation-delay:-1s}
  @keyframes particleFloat{
    0%,100%{transform:translateY(0) scale(1);opacity:.5}
    50%{transform:translateY(-40px) scale(1.3);opacity:.9}
  }

  .stage{
    position:relative;z-index:5;width:100%;max-width:1250px;
    display:flex;align-items:center;justify-content:center;
    gap:2rem;flex-wrap:wrap;
  }

  /* ===== پانکراس سه‌بعدی ===== */
  .pancreas-3d{
    position:relative;width:140px;height:200px;
    transform-style:preserve-3d;
    animation:spinPancreas 18s linear infinite;
    flex-shrink:0;
    filter:drop-shadow(0 30px 50px rgba(255,30,77,.55));
  }
  @keyframes spinPancreas{
    from{transform:rotateY(0) rotateX(10deg)}
    to{transform:rotateY(360deg) rotateX(10deg)}
  }
  .panc-slice{
    position:absolute;left:50%;top:0;
    width:100%;height:100%;margin-left:-70px;
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    background:
      radial-gradient(circle at 40% 18%,#ffd0dd 0%,transparent 30%),
      radial-gradient(circle at 60% 75%,#5a0018 0%,transparent 55%),
      radial-gradient(circle at 50% 50%,#ff5c7a 0%,#c9184a 60%,#6b0020 100%);
    transform-origin:center bottom;
    box-shadow:
      inset -10px -16px 26px rgba(40,0,15,.7),
      inset 10px 14px 22px rgba(255,170,200,.35);
  }
  .panc-slice::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background-image:radial-gradient(circle,#ffe08a 1.1px,transparent 1.5px);
    background-size:15px 15px;opacity:.85;mix-blend-mode:screen;
  }
  .p1 {transform:rotateY(0deg)   scale(.30) translateY(135px)}
  .p2 {transform:rotateY(30deg)  scale(.42) translateY(108px)}
  .p3 {transform:rotateY(60deg)  scale(.54) translateY(82px)}
  .p4 {transform:rotateY(90deg)  scale(.66) translateY(58px)}
  .p5 {transform:rotateY(120deg) scale(.76) translateY(36px)}
  .p6 {transform:rotateY(150deg) scale(.84) translateY(18px)}
  .p7 {transform:rotateY(180deg) scale(.90) translateY(2px)}
  .p8 {transform:rotateY(210deg) scale(.95) translateY(-10px)}
  .p9 {transform:rotateY(240deg) scale(.98) translateY(-20px)}
  .p10{transform:rotateY(270deg) scale(1)   translateY(-28px)}
  .p11{transform:rotateY(300deg) scale(.95) translateY(-32px)}
  .p12{transform:rotateY(330deg) scale(.85) translateY(-34px)}

  /* ===== قطره خون ===== */
  .blood-drop-3d{
    position:relative;width:130px;height:170px;
    transform-style:preserve-3d;
    animation:spinDrop 12s linear infinite;
    flex-shrink:0;
    filter:drop-shadow(0 25px 45px rgba(255,30,77,.6));
  }
  @keyframes spinDrop{
    from{transform:rotateY(0) rotateX(6deg)}
    to{transform:rotateY(360deg) rotateX(6deg)}
  }
  .drop-slice{
    position:absolute;left:50%;top:0;
    width:100%;height:100%;margin-left:-65px;
    border-radius:50% 50% 50% 50% / 70% 70% 30% 30%;
    background:
      radial-gradient(circle at 38% 28%,#ffd0dd 0%,transparent 28%),
      radial-gradient(circle at 62% 72%,#6b0020 0%,transparent 55%),
      radial-gradient(circle at 50% 50%,#ff1e4d 0%,#b0103a 70%,#5a0018 100%);
    transform-origin:center bottom;
    box-shadow:
      inset -8px -14px 24px rgba(40,0,15,.7),
      inset 8px 12px 20px rgba(255,180,200,.4);
  }
  .d1 {transform:rotateY(0deg)   scale(.30) translateY(110px)}
  .d2 {transform:rotateY(45deg)  scale(.45) translateY(85px)}
  .d3 {transform:rotateY(90deg)  scale(.60) translateY(60px)}
  .d4 {transform:rotateY(135deg) scale(.75) translateY(38px)}
  .d5 {transform:rotateY(180deg) scale(.88) translateY(18px)}
  .d6 {transform:rotateY(225deg) scale(.96) translateY(2px)}
  .d7 {transform:rotateY(270deg) scale(1)   translateY(-12px)}
  .d8 {transform:rotateY(315deg) scale(.94) translateY(-18px)}

  .drop-tip{
    position:absolute;top:-26px;left:50%;
    width:0;height:0;margin-left:-15px;
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-bottom:34px solid #ff1e4d;
    transform:translateZ(35px) rotateX(-10deg);
    filter:drop-shadow(0 0 12px #ff1e4d);
  }

  .rbc{
    position:absolute;width:18px;height:12px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#ff8fa3,#c9184a 60%,#6b0020);
    box-shadow:0 0 10px #ff1e4d,inset -3px -3px 6px rgba(60,0,20,.7),inset 3px 3px 6px rgba(255,180,200,.4);
    opacity:.9;
  }
  .rbc.r1{top:10%;left:-22px;animation:orbitRBC1 6s ease-in-out infinite}
  .rbc.r2{top:60%;right:-25px;animation:orbitRBC2 7s ease-in-out infinite}
  .rbc.r3{bottom:5%;left:8%;animation:orbitRBC1 8s ease-in-out infinite reverse}
  @keyframes orbitRBC1{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-12px,-18px) rotate(28deg)}}
  @keyframes orbitRBC2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(15px,14px) rotate(-22deg)}}

  /* ===== مولکول گلوکز ===== */
  .glucose-molecule{
    position:relative;width:170px;height:170px;
    transform-style:preserve-3d;
    animation:spinMolecule 20s linear infinite;
    flex-shrink:0;
    filter:drop-shadow(0 25px 45px rgba(0,240,255,.4));
  }
  @keyframes spinMolecule{
    from{transform:rotateX(14deg) rotateY(0)}
    to{transform:rotateX(14deg) rotateY(360deg)}
  }
  .g-core{
    position:absolute;top:50%;left:50%;
    width:80px;height:80px;margin:-40px 0 0 -40px;
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%,#e0ffff 0%,transparent 30%),
      radial-gradient(circle at 70% 72%,#003a4a 0%,transparent 55%),
      radial-gradient(circle at 50% 50%,#00f0ff 0%,#0088aa 70%,#002a3a 100%);
    box-shadow:
      inset -10px -14px 26px rgba(0,30,40,.8),
      inset 8px 10px 22px rgba(150,240,255,.5),
      0 0 35px rgba(0,240,255,.9),
      0 0 70px rgba(0,240,255,.4);
    transform:translateZ(30px);
  }
  .g-core::after{
    content:"";position:absolute;top:14%;left:18%;
    width:34%;height:26%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95),transparent 70%);
    filter:blur(1.5px);transform:translateZ(20px);
  }

  .g-ring{
    position:absolute;top:50%;left:50%;
    border-radius:50%;border:2px solid rgba(0,240,255,.6);
    box-shadow:0 0 16px rgba(0,240,255,.6),inset 0 0 16px rgba(0,240,255,.3);
    transform-style:preserve-3d;
  }
  .g-ring.r1{width:130px;height:130px;margin:-65px 0 0 -65px;transform:rotateX(72deg) rotateY(12deg)}
  .g-ring.r2{width:148px;height:148px;margin:-74px 0 0 -74px;transform:rotateY(72deg) rotateX(-16deg)}
  .g-ring.r3{width:112px;height:112px;margin:-56px 0 0 -56px;transform:rotateX(40deg) rotateY(52deg)}

  .g-electron{
    position:absolute;width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#00f0ff 60%,#0088aa);
    box-shadow:0 0 12px #00f0ff,0 0 24px #00f0ff80;
  }
  .ge1{top:-5.5px;left:50%;margin-left:-5.5px;animation:pulseG 5s ease-in-out infinite}
  .ge2{bottom:-5.5px;left:50%;margin-left:-5.5px;animation:pulseG 5s ease-in-out infinite reverse}
  .ge3{top:50%;left:-5.5px;margin-top:-5.5px;animation:pulseG 4s ease-in-out infinite}
  .ge4{top:50%;right:-5.5px;margin-top:-5.5px;animation:pulseG 4s ease-in-out infinite reverse}
  @keyframes pulseG{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}

  /* ===== کارت فرم ===== */
  .card{
    position:relative;z-index:10;width:100%;max-width:460px;
    padding:2rem 1.7rem 1.6rem;border-radius:32px;
    background:linear-gradient(150deg,rgba(20,5,15,.82),rgba(40,5,25,.65));
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1.5px solid rgba(255,90,140,.35);
    box-shadow:
      0 50px 100px -30px rgba(0,0,0,.9),
      0 0 0 1px rgba(255,90,140,.15),
      inset 0 1px 0 rgba(255,180,210,.2);
    transition:transform .15s ease-out;
    animation:cardIn .9s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes cardIn{0%{opacity:0;transform:translateY(50px) scale(.95)}100%{opacity:1;transform:none}}

  .card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(circle at 20% 0%,rgba(255,90,140,.2),transparent 45%);
    pointer-events:none;
  }

  .card h1{
    font-size:1.6rem;font-weight:900;color:#fff;text-align:center;
    letter-spacing:-.5px;
    text-shadow:0 2px 12px rgba(255,30,77,.9),0 0 30px rgba(255,30,77,.5);
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-bottom:.3rem;
  }
  .h-icon{font-size:1.7rem;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(255,30,77,.7))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-6deg)}}

  .card .sub{text-align:center;font-size:.75rem;color:#ff9eb5;font-weight:500;margin-bottom:1.4rem;letter-spacing:.3px}

  .field{margin-bottom:.9rem}
  .field label{display:block;font-size:.75rem;font-weight:700;color:#ff9eb5;margin-bottom:.35rem;padding-right:.4rem}
  .field input{
    width:100%;padding:.75rem 1rem;font-family:inherit;font-size:1rem;font-weight:600;
    color:#fff;background:rgba(255,255,255,.07);
    border:1.5px solid rgba(255,120,160,.3);border-radius:14px;outline:none;
    transition:.25s;direction:ltr;text-align:left;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.3);
  }
  .field input::placeholder{color:rgba(255,160,190,.45);font-weight:400}
  .field input:focus{
    border-color:#ff2e88;background:rgba(255,255,255,.13);
    box-shadow:0 0 0 4px rgba(255,46,136,.18),0 0 28px rgba(255,46,136,.4);
  }

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}

  .btn{
    position:relative;width:100%;margin-top:1rem;padding:.9rem;
    font-family:inherit;font-size:1.05rem;font-weight:900;color:#fff;
    letter-spacing:.5px;border:none;border-radius:16px;cursor:pointer;
    background:linear-gradient(145deg,#ff2e88,#ff1e4d 50%,#8a0026);
    box-shadow:
      0 8px 0 #4a0015,
      0 16px 32px rgba(255,30,77,.5),
      inset 0 2px 0 rgba(255,255,255,.4);
    transition:all .12s ease;
  }
  .btn:hover{background:linear-gradient(145deg,#ff5c9e,#ff2e63 50%,#a30b33)}
  .btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #4a0015,0 10px 20px rgba(255,30,77,.4);
  }

  .result{
    margin-top:1.1rem;min-height:90px;border-radius:20px;padding:1rem;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;text-align:center;background:rgba(255,255,255,.05);
    border:1.5px dashed rgba(255,120,160,.4);
    transition:.35s;
  }
  .result .emoji{font-size:2.2rem}
  .result .title{font-size:1rem;font-weight:900}
  .result .desc{font-size:.72rem;opacity:.8;font-weight:500}

  .result.positive{
    background:linear-gradient(145deg,rgba(255,30,77,.3),rgba(138,0,38,.4));
    border-color:#ff2e88;
    box-shadow:0 0 0 4px rgba(255,30,77,.1),0 0 35px rgba(255,30,77,.4) inset;
  }
  .result.negative{
    background:linear-gradient(145deg,rgba(46,229,157,.22),rgba(15,155,108,.3));
    border-color:#2ee59d;
    box-shadow:0 0 0 4px rgba(46,229,157,.1),0 0 35px rgba(46,229,157,.3) inset;
  }

  .badge{
    font-size:.62rem;font-weight:700;padding:.15rem .7rem;border-radius:20px;
    background:rgba(255,255,255,.14);color:#ffd0e0;margin-bottom:2px;
  }

  .footer{text-align:center;font-size:.65rem;color:rgba(255,160,190,.55);margin-top:.9rem}

  @media(max-width:1100px){
    .pancreas-3d{width:110px;height:155px}
    .panc-slice{margin-left:-55px;width:110px;height:155px}
    .blood-drop-3d{width:110px;height:145px}
    .drop-slice{margin-left:-55px;width:110px;height:145px}
    .glucose-molecule{width:150px;height:150px}
    .g-core{width:70px;height:70px;margin:-35px 0 0 -35px}
    .g-ring.r1{width:112px;height:112px;margin:-56px 0 0 -56px}
    .g-ring.r2{width:128px;height:128px;margin:-64px 0 0 -64px}
    .g-ring.r3{width:98px;height:98px;margin:-49px 0 0 -49px}
  }
  @media(max-width:900px){
    .stage{gap:1rem}
    .pancreas-3d,.glucose-molecule{display:none}
    .blood-drop-3d{width:90px;height:120px}
    .drop-slice{margin-left:-45px;width:90px;height:120px}
  }
  @media(max-width:600px){
    .blood-drop-3d{display:none}
    .grid2{grid-template-columns:1fr}
    .card{padding:1.6rem 1.1rem 1.3rem}
    .card h1{font-size:1.35rem}
  }
</style>
</head>
<body>

  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

  <div class="gp"></div><div class="gp"></div><div class="gp"></div><div class="gp"></div>

  <div class="stage">

    <!-- پانکراس -->
    <div class="pancreas-3d" aria-hidden="true">
      <div class="panc-slice p1"></div><div class="panc-slice p2"></div>
      <div class="panc-slice p3"></div><div class="panc-slice p4"></div>
      <div class="panc-slice p5"></div><div class="panc-slice p6"></div>
      <div class="panc-slice p7"></div><div class="panc-slice p8"></div>
      <div class="panc-slice p9"></div><div class="panc-slice p10"></div>
      <div class="panc-slice p11"></div><div class="panc-slice p12"></div>
    </div>

    <!-- قطره خون -->
    <div class="blood-drop-3d" aria-hidden="true">
      <div class="drop-tip"></div>
      <div class="drop-slice d1"></div><div class="drop-slice d2"></div>
      <div class="drop-slice d3"></div><div class="drop-slice d4"></div>
      <div class="drop-slice d5"></div><div class="drop-slice d6"></div>
      <div class="drop-slice d7"></div><div class="drop-slice d8"></div>
      <div class="rbc r1"></div><div class="rbc r2"></div><div class="rbc r3"></div>
    </div>

    <!-- کارت فرم -->
    <main class="card" id="card">
      <h1><span class="h-icon">🩸</span> آزمایشگاه دیابت <span class="h-icon">🍬</span></h1>
      <p class="sub">تحلیل سه‌بعدی • درخت تصمیم هوشمند</p>

      <form id="form" onsubmit="return false;">
        <div class="field">
          <label>🍬 گلوکز (mg/dL)</label>
          <input type="number" id="glucose" step="1" min="0" placeholder="120" value="120">
        </div>
        <div class="grid2">
          <div class="field">
            <label>🎂 سن (سال)</label>
            <input type="number" id="age" step="1" min="1" placeholder="35" value="35">
          </div>
          <div class="field">
            <label>⚖️ شاخص BMI</label>
            <input type="number" id="bmi" step="0.1" min="10" placeholder="28.5" value="28.5">
          </div>
        </div>
        <div class="field">
          <label>🧬 عملکرد شجره دیابت (DPF)</label>
          <input type="number" id="dpf" step="0.001" min="0" placeholder="0.45" value="0.45">
        </div>
        <button type="button" class="btn" id="btn">🩸 تشخیص بده 🍬</button>
      </form>

      <div class="result" id="result">
        <div class="emoji">🩸</div>
        <div class="title">آماده‌ی تحلیل</div>
        <div class="desc">مقادیر را وارد کن و دکمه را بزن</div>
      </div>

      <div class="footer">✨ CSS 3D • بدون کتابخانه ✨</div>
    </main>

    <!-- مولکول گلوکز -->
    <div class="glucose-molecule" aria-hidden="true">
      <div class="g-core"></div>
      <div class="g-ring r1"><span class="g-electron ge1"></span><span class="g-electron ge2"></span></div>
      <div class="g-ring r2"><span class="g-electron ge3"></span><span class="g-electron ge4"></span></div>
      <div class="g-ring r3"></div>
    </div>

  </div>

<script>
(function(){
  function predict(g, a, b, d){
    if (g <= 154){
      if (a <= 29) return 0;
      if (b <= 26.700) return 0;
      if (g <= 101) return (d <= 0.709) ? 0 : 1;
      if (b <= 43.300) return (d <= 0.464) ? 0 : 1;
      return 1;
    }
    if (d <= 0.307) return (d <= 0.287) ? 1 : 0;
    return 1;
  }

  function showResult(){
    var resultBox = document.getElementById('result');
    var g = parseFloat(document.getElementById('glucose').value);
    var a = parseFloat(document.getElementById('age').value);
    var b = parseFloat(document.getElementById('bmi').value);
    var d = parseFloat(document.getElementById('dpf').value);

    if (isNaN(g) || isNaN(a) || isNaN(b) || isNaN(d) || g < 0 || a < 0 || b < 0 || d < 0){
      resultBox.className = 'result';
      resultBox.innerHTML = '<div class="emoji">😿</div><div class="title">ورودی نامعتبر</div><div class="desc">همه مقادیر را با عدد مثبت پر کن</div>';
      return;
    }

    var out = predict(g, a, b, d);

    if (out === 1){
      resultBox.className = 'result positive';
      resultBox.innerHTML = '<div class="badge">نتیجه تحلیل 3D</div><div class="emoji">🩸💔</div><div class="title">احتمال دیابت: مثبت</div><div class="desc">برای بررسی دقیق به پزشک مراجعه کن</div>';
    } else {
      resultBox.className = 'result negative';
      resultBox.innerHTML = '<div class="badge">نتیجه تحلیل 3D</div><div class="emoji">🩸💚</div><div class="title">احتمال دیابت: منفی</div><div class="desc">عالیه! مراقب سلامتی‌ات باش</div>';
    }
  }

  document.getElementById('btn').addEventListener('click', showResult);

  ['glucose','age','bmi','dpf'].forEach(function(id){
